---
kali_os_upgrade: true
# Desktop user. Gets the login shell, dotfiles and power settings, as does root.
kali_user: '{{ ansible_user }}'
# Login shell of root and kali_user; bash and zsh stay installed either way.
kali_shell: /bin/bash
# GitHub user whose dotfiles repo chezmoi applies.
kali_chezmoi_user: xbufu
kali_enable_rdp: true
# QTerminal [General] settings for root and kali_user (Kali ships fontSize=10, TerminalTransparency=5).
# XKB layouts (first is the default) and the switch shortcut; grp:win_space_toggle is Super+Space.
kali_keyboard_layouts: us,de
kali_keyboard_switch: grp:win_space_toggle
# Keyboard layout panel indicator; property names and values from xfce4-xkb-plugin
# (display-type 0 image, 1 text, 2 system; group-policy 0 global, 1 window, 2 application).
kali_xkb_plugin_settings:
  display-type: 1
  display-scale: 50
  group-policy: 0
  caps-lock-indicator: false
# Burp's CA, exported once and trusted by the system and Firefox.
kali_burp_ca_path: /usr/local/share/ca-certificates/burp-ca.crt
# Burp loads <dir>/user.json and <dir>/project.json on every start (from files/burp-*.json).
kali_burp_config_dir: /etc/burpsuite
# Jython standalone for Burp's Python extensions; checksum of the Maven Central jar.
kali_jython_version: 2.7.4
kali_jython_sha256: 1fba1769effcc8b19f5e10436bc8274a158ce988559f257927c24c73bb137f3c
kali_jython_jar: /opt/jython/jython-standalone-{{ kali_jython_version }}.jar
# Firefox add-ons: extension id -> addons.mozilla.org slug.
kali_firefox_extensions:
  foxyproxy@eric.h.jung: foxyproxy-standard
  "@testpilot-containers": multi-account-containers
kali_firefox_bookmarks:
  - title: PayloadsAllTheThings
    url: https://swisskyrepo.github.io/PayloadsAllTheThings/
  - title: HackTricks
    url: https://hacktricks.wiki/
  - title: RevShells
    url: https://www.revshells.com/
  - title: CyberChef
    url: https://gchq.github.io/CyberChef/
  - title: Hack The Box
    url: https://app.hackthebox.com/home
# about:config defaults; .htb opens as a host instead of a web search.
kali_firefox_prefs:
  browser.fixup.domainsuffixwhitelist.htb: true
kali_qterminal_settings:
  fontSize: 12
  TerminalTransparency: 0

