---
- name: Extract rockyou.txt
  ansible.builtin.command: gzip -dq /usr/share/wordlists/rockyou.txt.gz
  args:
    creates: /usr/share/wordlists/rockyou.txt

- name: Desktop settings per user
  vars:
    kali_xfconf_dir: .config/xfce4/xfconf/xfce-perchannel-xml
    kali_config_dirs:
      - .config
      - .config/xfce4
      - .config/xfce4/xfconf
      - "{{ kali_xfconf_dir }}"
      - .config/qterminal.org
    # One empty variant per layout: "us,de" -> ","
    kali_keyboard_variants: "{{ kali_keyboard_layouts | regex_replace('[^,]', '') }}"
  block:
    - name: Look up user accounts
      ansible.builtin.getent:
        database: passwd

    # Each level gets the user as owner; a plain recursive create would leave ~/.config owned by root.
    - name: Create config folders
      ansible.builtin.file:
        path: "{{ ansible_facts['getent_passwd'][item.0][4] }}/{{ item.1 }}"
        state: directory
        owner: '{{ item.0 }}'
        group: "{{ ansible_facts['getent_passwd'][item.0][2] }}"
        mode: '0700'
      loop: "{{ kali_users | product(kali_config_dirs) | list }}"

    - name: Disable screen blanking and power actions
      ansible.builtin.copy:
        dest: "{{ ansible_facts['getent_passwd'][item][4] }}/{{ kali_xfconf_dir }}/xfce4-power-manager.xml"
        owner: '{{ item }}'
        group: "{{ ansible_facts['getent_passwd'][item][2] }}"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xfce4-power-manager" version="1.0">
            <property name="xfce4-power-manager" type="empty">
              <property name="power-button-action" type="empty"/>
              <property name="show-panel-label" type="empty"/>
              <property name="show-tray-icon" type="bool" value="false"/>
              <property name="lock-screen-suspend-hibernate" type="bool" value="false"/>
              <property name="logind-handle-lid-switch" type="bool" value="false"/>
              <property name="blank-on-ac" type="int" value="0"/>
              <property name="dpms-on-ac-sleep" type="uint" value="0"/>
              <property name="dpms-on-ac-off" type="uint" value="0"/>
              <property name="dpms-enabled" type="bool" value="false"/>
            </property>
          </channel>
        mode: '0644'
      loop: '{{ kali_users }}'

    # Matches the usual host state, so a VMware focus change does not toggle Num Lock.
    - name: Turn Num Lock on in the XFCE session
      ansible.builtin.copy:
        dest: "{{ ansible_facts['getent_passwd'][item][4] }}/{{ kali_xfconf_dir }}/keyboards.xml"
        owner: '{{ item }}'
        group: "{{ ansible_facts['getent_passwd'][item][2] }}"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="keyboards" version="1.0">
            <property name="Default" type="empty">
              <property name="Numlock" type="bool" value="true"/>
              <property name="RestoreNumlock" type="bool" value="true"/>
            </property>
          </channel>
        mode: '0644'
      loop: '{{ kali_users }}'

    - name: Add keyboard layouts and the layout switch shortcut
      ansible.builtin.copy:
        dest: "{{ ansible_facts['getent_passwd'][item][4] }}/{{ kali_xfconf_dir }}/keyboard-layout.xml"
        owner: '{{ item }}'
        group: "{{ ansible_facts['getent_passwd'][item][2] }}"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="keyboard-layout" version="1.0">
            <property name="Default" type="empty">
              <property name="XkbDisable" type="bool" value="false"/>
              <property name="XkbLayout" type="string" value="{{ kali_keyboard_layouts }}"/>
              <property name="XkbVariant" type="string" value="{{ kali_keyboard_variants }}"/>
              <property name="XkbOptions" type="empty">
                <property name="Group" type="string" value="{{ kali_keyboard_switch }}"/>
              </property>
            </property>
          </channel>
        mode: '0644'
      loop: '{{ kali_users }}'

    # kali-themes force-overwrites /etc/xdg/qterminal.org/qterminal.ini on upgrade, so set it per user.
    - name: Set QTerminal font size and transparency
      community.general.ini_file:
        path: "{{ ansible_facts['getent_passwd'][item.0][4] }}/.config/qterminal.org/qterminal.ini"
        section: General
        option: '{{ item.1.key }}'
        value: '{{ item.1.value }}'
        no_extra_spaces: true
        owner: '{{ item.0 }}'
        group: "{{ ansible_facts['getent_passwd'][item.0][2] }}"
        mode: '0644'
      loop: "{{ kali_users | product(kali_qterminal_settings | dict2items) | list }}"
      loop_control:
        label: '{{ item.0 }} {{ item.1.key }}={{ item.1.value }}'

# Login screen and console; the XFCE session uses keyboard-layout.xml above.
- name: Set the system keyboard layouts
  ansible.builtin.lineinfile:
    path: /etc/default/keyboard
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}="{{ item.value }}"'
  loop:
    - key: XKBLAYOUT
      value: "{{ kali_keyboard_layouts }}"
    - key: XKBOPTIONS
      value: "{{ kali_keyboard_switch }}"
  loop_control:
    label: '{{ item.key }}'

- name: Turn Num Lock on at the login screen
  block:
    - name: Install numlockx
      ansible.builtin.apt:
        name: numlockx
        state: present

    - name: Run numlockx from the LightDM greeter
      ansible.builtin.copy:
        dest: /etc/lightdm/lightdm.conf.d/02-numlock.conf
        content: |
          [Seat:*]
          greeter-setup-script=/usr/bin/numlockx on
        mode: '0644'

- name: Silence PC beep
  block:
    - name: Create config directory
      ansible.builtin.file:
        path: /etc/modprobe.d
        state: directory
        mode: '0755'

    - name: Create config file
      ansible.builtin.copy:
        dest: /etc/modprobe.d/nobeep.conf
        content: blacklist pcspkr
        mode: '0644'
