---
# Metapackage tracks the newest kernel; headers for the running one may be gone after the upgrade.
- name: Install kernel headers
  ansible.builtin.apt:
    update_cache: true
    name: "linux-headers-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    state: present

- name: Install base packages
  ansible.builtin.apt:
    update_cache: true
    name: '{{ kali_base_packages }}'
    state: present

- name: Install tools
  ansible.builtin.apt:
    update_cache: true
    name: '{{ kali_tool_packages }}'
    state: present
