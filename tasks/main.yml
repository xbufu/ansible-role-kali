---
- name: Upgrade OS
  ansible.builtin.include_tasks: os_upgrade.yml
  when: kali_os_upgrade

- name: Install packages
  ansible.builtin.include_tasks: packages.yml

- name: Install guest tools
  ansible.builtin.include_tasks: virtualization.yml
  when:
    - ansible_facts['virtualization_role'] == "guest"
    - ansible_facts['virtualization_type'] in ["kvm", "VMware"]

- name: Configure Burp and Firefox
  ansible.builtin.include_tasks: browser.yml

- name: Set login shell
  ansible.builtin.include_tasks: shell.yml

- name: Apply dotfiles
  ansible.builtin.include_tasks: dotfiles.yml

- name: Enable RDP
  ansible.builtin.include_tasks: rdp.yml
  when: kali_enable_rdp

- name: Apply fixes
  ansible.builtin.include_tasks: fixes.yml
